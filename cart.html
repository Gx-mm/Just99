<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Cart - 99Shops</title>
    <!-- Link to new premium cart CSS -->
    <link rel="stylesheet" href="css/cart.css">
</head>
<body>
    <!-- TOP NAVBAR -->
    <header class="glass-header">
        <div class="header-main">
            <a href="home.html" class="logo">
                <span class="logo-text">99Shops</span>
            </a>
            
            <div class="header-actions">
                <a href="wishlist.html" class="action-btn">
                    <div class="icon-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                        <span class="badge" id="headerWishlistCount" style="display:none">0</span>
                    </div>
                </a>
                <!-- Cart is active here -->
                <a href="cart.html" class="action-btn active-top">
                    <div class="icon-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                        <span class="badge" id="headerCartCount" style="display:none">0</span>
                    </div>
                </a>
                <a href="profile.html" class="action-btn">
                    <div class="icon-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    </div>
                </a>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="section-header">
            <h2>🛒 My Cart</h2>
            <button class="clear-cart-btn" onclick="clearCart()" id="clearCartBtn" style="display:none;">Clear All</button>
        </div>
        
        <!-- Yaha JavaScript data load karega -->
        <div id="cartContainer">
            <!-- Skeleton Loading UI -->
            <div class="cart-card skeleton">
                <div class="cart-img skeleton-box"></div>
                <div class="cart-details">
                    <div class="sk-line" style="width: 80%"></div>
                    <div class="sk-line" style="width: 50%"></div>
                    <div class="sk-line" style="width: 30%"></div>
                </div>
            </div>
            <div class="cart-card skeleton">
                <div class="cart-img skeleton-box"></div>
                <div class="cart-details">
                    <div class="sk-line" style="width: 80%"></div>
                    <div class="sk-line" style="width: 50%"></div>
                    <div class="sk-line" style="width: 30%"></div>
                </div>
            </div>
        </div>

        <!-- Yaha Total Summary aayegi -->
        <div id="cartSummaryContainer"></div>

    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
        <a href="home.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            <span>Home</span>
        </a>
        <a href="category.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            <span>Categories</span>
        </a>
        
        <!-- Center Floating Cart (Active) -->
        <div class="nav-item center-float-wrapper">
            <a href="cart.html" class="floating-cart ripple active-float">
                <svg viewBox="0 0 24 24" fill="white" stroke="white" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                <span class="float-badge" id="floatCartCount" style="display:none">0</span>
            </a>
        </div>
        
        <a href="orders.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
            <span>Orders</span>
        </a>
        <a href="profile.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span>Account</span>
        </a>
    </nav>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/cart.js"></script>
</body>
</html>
