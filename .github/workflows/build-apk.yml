name: Build Android APK

on:
  push:
    branches: [ main, master ] # aapki branch ka naam jo bhi ho
  workflow_dispatch: # Taaki aap manual button click se bhi run kar sakein

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Workspace & Add Android
        run: |
          npm install
          mkdir -p www
          touch www/index.html
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: my-android-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
