name: Build Trendify APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prepare Workspace & Add Android
        run: |
          npm install
          mkdir -p www
          touch www/index.html
          npx cap add android
          
          # App Icon Setup (Aapka appicon.png use karega)
          mkdir -p assets
          cp appicon.png assets/icon.png || echo "Icon not found, using default"
          npx @capacitor/assets generate --android
          
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK to Trendify.apk
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Trendify.apk

      - name: Upload ZIP Artifact (Trendify.zip)
        uses: actions/upload-artifact@v4
        with:
          name: Trendify
          path: android/app/build/outputs/apk/debug/Trendify.apk
