<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>99Shops - Categories</title>
    <link rel="stylesheet" href="css/category.css">
</head>
<body>
    <!-- TOP NAVBAR (Exactly matching Home Page) -->
    <header class="glass-header">
        <div class="header-main">
            <a href="home.html" class="logo">
                <span class="logo-text">99Shops</span>
            </a>
            
            <div class="search-container">
                <div class="search-box">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="searchInput" placeholder="Search for products..." autocomplete="off">
                </div>
                <div id="searchResults" class="search-results-dropdown"></div>
            </div>

            <div class="header-actions">
                <a href="wishlist.html" class="action-btn">
                    <div class="icon-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                        <span class="badge" id="headerWishlistCount" style="display:none">0</span>
                    </div>
                    <span>Wishlist</span>
                </a>
                <a href="cart.html" class="action-btn">
                    <div class="icon-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" <!--  -->y="21" r="1"></circle><circle cx=>></" ="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></<sv></sv><span class="badge" id="headerCartCount" style="display:none">0</span>
                    </div>
                    <span>Cart</span>
                </a>
                <a href="profile.html" class="action-btn">
                    <div class="icon-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    </div>
                    <span>Profile</span>
                </a>
            </div>
        </div>
    </header>

    <!-- MAIN CATEGORY CONTENT -->
    <!-- Note: Standard structure maintained to keep existing Supabase/JS functionality intact -->
    <main class="main-content category-page-layout">
        
        <!-- Category Sidebar -->
        <aside class="category-sidebar">
            <h3 class="sidebar-title">Categories</h3>
            <div class="filter-list" id="categoriesContainer">
                <button class="filter-item active" data-category="all">All Products</button>
                <!-- Skeleton Filters -->
                <div class="filter-item skeleton-filter skeleton"></div>
                <div class="filter-item skeleton-filter skeleton"></div>
                <div class="filter-item skeleton-filter skeleton"></div>
            </div>
        </aside>

        <!-- Product Grid Section -->
        <section class="category-products">
            <div class="section-header">
                <h2 id="currentCategoryTitle">All Products</h2>
                <button class="mobile-filter-btn" id="mobileFilterToggle">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
                    Filters
                </button>
            </div>
            
            <div class="products-grid" id="productsContainer">
                <!-- Product Skeleton Loaders -->
                <div class="product-card skeleton"></div>
                <div class="product-card skeleton"></div>
                <div class="product-card skeleton"></div>
                <div class="product-card skeleton"></div>
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="empty-state" style="display:none;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <h3>No products found</h3>
                <p>Try adjusting your search or category filters.</p>
            </div>
        </section>

    </main>

    <!-- CUSTOM POPUP -->
    <div id="customPopup" class="popup-overlay">
        <div class="popup-box">
            <h3 id="popupTitle">Notification</h3>
            <p id="popupMessage">Message goes here</p>
            <button id="popupBtn">OK</button>
        </div>
    </div>

    <!-- BOTTOM NAVBAR (Exactly matching Home Page with correct active state & links) -->
    <nav class="bottom-nav">
        <a href="home.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            <span>Home</span>
        </a>
        <a href="category.html" class="nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            <span>Categories</span>
        </a>
        <div class="nav-item center-float-wrapper">
            <a href="cart.html" class="floating-cart ripple">
                <svg viewBox="0 0 24 24" fill="white" stroke="white" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                <span class="float-badge" id="floatCartCount" style="display:none">0</span>
            </a>
        </div>
        <a href="orders.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
            <span>Orders</span>
        </a>
        <a href="profile.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span>Account</span>
        </a>
    </nav>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Maintain your existing category JS file -->
    <script src="js/category.js"></script>
</body>
</html>
