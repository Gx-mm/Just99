<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Add Smart Balance - 99Shops</title>
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* =========================
           VARIABLES & RESETS
        ========================= */
        :root {
            --primary: #0066ff;
            --primary-hover: #0052cc;
            --secondary: #f0f5ff;
            --text-main: #1a1a1a;
            --text-muted: #666666;
            --bg-main: #f8f9fa;
            --card-bg: #ffffff;
            --danger: #ff4757;
            --success: #2ed573;
            --border: #eef0f5;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --shadow-sm: 0 4px 15px rgba(0,0,0,0.04);
            --shadow-md: 0 8px 25px rgba(0,0,0,0.08);
            --shadow-float: 0 12px 30px rgba(0, 102, 255, 0.3);
            --safe-area-bottom: env(safe-area-inset-bottom, 0px);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-main); color: var(--text-main); padding-bottom: calc(100px + var(--safe-area-bottom)); overflow-x: hidden; }
        button { border: none; background: none; cursor: pointer; outline: none; }
        a { text-decoration: none; color: inherit; }

        /* =========================
           HEADER
        ========================= */
        .glass-header { position: sticky; top: 0; z-index: 1000; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.3); box-shadow: var(--shadow-sm); padding: 12px 20px; }
        .header-main { display: flex; align-items: center; max-width: 800px; margin: 0 auto; gap: 15px; }
        .back-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--bg-main); display: flex; align-items: center; justify-content: center; color: var(--text-main); transition: 0.2s; }
        .back-btn:hover { background: var(--border); }
        .back-btn svg { width: 20px; height: 20px; }
        .logo-text { font-size: 20px; font-weight: 800; color: var(--text-main); }

        /* =========================
           MAIN LAYOUT & CARD
        ========================= */
        .container { max-width: 500px; margin: 25px auto; padding: 0 15px; animation: fadeIn 0.4s ease; }
        
        .card { background: var(--card-bg); padding: 30px 25px; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); text-align: center; }
        .card h2 { font-size: 22px; font-weight: 800; color: var(--primary); margin-bottom: 25px; }

        /* =========================
           QR CODE SECTION
        ========================= */
        .qr-box { width: 220px; height: 220px; margin: 0 auto 25px; padding: 15px; background: #fff; border: 2px dashed #cbd5e1; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-sm); transition: transform 0.3s; }
        .qr-box:hover { transform: scale(1.02); border-color: var(--primary); }
        .qr-box img { width: 100%; height: 100%; object-fit: contain; }

        /* =========================
           INPUTS & BUTTONS
        ========================= */
        .input-group { position: relative; margin-bottom: 18px; text-align: left; }
        .input-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
        
        input { width: 100%; padding: 14px 16px; background: var(--bg-main); border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-size: 15px; color: var(--text-main); outline: none; transition: all 0.3s; }
        input:focus { background: #fff; border-color: var(--primary); box-shadow: 0 0 0 3px var(--secondary); }
        input[readonly] { background: #f8fafc; color: #475569; font-weight: 600; }

        .copy-btn { position: absolute; right: 10px; top: 32px; background: var(--secondary); color: var(--primary); font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 6px; transition: 0.2s; }
        .copy-btn:hover { background: var(--primary); color: #fff; }

        .submit-btn { width: 100%; height: 55px; border-radius: var(--radius-sm); background: var(--primary); color: #fff; font-size: 16px; font-weight: 700; margin-top: 10px; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(0, 102, 255, 0.2); }
        .submit-btn:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 102, 255, 0.3); }
        .submit-btn:active { transform: translateY(0); }
        .submit-btn:disabled { opacity: 0.7; cursor: not-allowed; }

        /* =========================
           TOAST & POPUP
        ========================= */
        .toast { display: none; position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: rgba(33, 33, 33, 0.95); color: #fff; padding: 12px 24px; border-radius: 30px; font-size: 14px; font-weight: 600; box-shadow: var(--shadow-md); z-index: 10000; animation: slideUp 0.3s ease forwards; backdrop-filter: blur(5px); }

        .custom-popup { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 99999; animation: fadeIn 0.3s ease; padding: 20px; }
        .popup-card { background: var(--card-bg); width: 100%; max-width: 380px; padding: 35px 25px; border-radius: var(--radius-lg); text-align: center; box-shadow: var(--shadow-md); animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .checkmark { width: 80px; height: 80px; background: var(--success); border-radius: 50%; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-size: 40px; color: #fff; animation: scale 0.5s ease 0.2s both; transform: scale(0); }
        .warning-mark { background: var(--danger); }
        .popup-card h2 { font-size: 22px; font-weight: 800; color: var(--text-main); margin-bottom: 10px; }
        .popup-card p { color: var(--text-muted); font-size: 14px; line-height: 1.5; margin-bottom: 25px; }
        .popup-btn { width: 100%; height: 50px; border-radius: var(--radius-sm); background: var(--primary); color: #fff; font-size: 16px; font-weight: 700; transition: 0.3s; }
        .popup-btn:hover { background: var(--primary-hover); }

        /* =========================
           BOTTOM NAVIGATION
        ========================= */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); display: flex; justify-content: space-around; align-items: center; box-shadow: 0 -10px 25px rgba(0,0,0,0.06); z-index: 9999; border-radius: 25px 25px 0 0; padding-bottom: var(--safe-area-bottom); }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); font-size: 11px; font-weight: 500; transition: color 0.3s; width: 60px; }
        .nav-item svg { width: 22px; height: 22px; transition: transform 0.3s; }
        .nav-item.active { color: var(--primary); }
        .nav-item.active svg { transform: translateY(-2px); stroke: var(--primary); }
        .nav-item:hover svg { transform: translateY(-2px); }

        .center-float-wrapper { position: relative; width: 60px; height: 60px; }
        .floating-cart { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); width: 60px; height: 60px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-float); transition: transform 0.3s, background 0.3s; z-index: 10000; }
        .floating-cart:hover { background: var(--primary-hover); transform: translateX(-50%) translateY(-5px); }
        .floating-cart svg { width: 28px; height: 28px; }

        /* Animations */
        @keyframes pop { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes scale { 0% { transform: scale(0); } 100% { transform: scale(1); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <!-- TOP NAVBAR -->
    <header class="glass-header">
        <div class="header-main">
            <button class="back-btn" onclick="history.back()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <span class="logo-text">Add Wallet Balance</span>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <div class="container">
        <div class="card">
            <h2>Scan & Pay</h2>

            <div class="qr-box">
                <!-- Ensure you have QR.png in the same folder -->
                <img src="QR.png" alt="QR Code" onerror="this.replaceWith(document.createTextNode('QR Image Unavailable'));">
            </div>

            <div class="input-group">
                <label>Company UPI ID</label>
                <input id="upi" value="BHARATPE2S0D0N4G6L34016@unitype" readonly>
                <button class="copy-btn" type="button" onclick="copyUPI()">COPY</button>
            </div>

            <div class="input-group">
                <label>Amount Paid (₹)</label>
                <input id="amount" type="number" placeholder="Enter Amount e.g. 500">
            </div>

            <div class="input-group">
                <label>UTR / Transaction ID</label>
                <input id="utr" type="text" placeholder="12-digit UTR number">
            </div>

            <button class="submit-btn" id="submitBtn" onclick="submitRequest()">Submit Request</button>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="toast"></div>

    <!-- SUCCESS/ERROR POPUP -->
    <div id="statusPopup" class="custom-popup">
        <div class="popup-card">
            <div class="checkmark" id="popupIcon">✓</div>
            <h2 id="popupTitle">Success!</h2>
            <p id="popupMessage">Your request has been submitted.</p>
            <button class="popup-btn" onclick="closePopup()">OK</button>
        </div>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
        <a href="home.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            <span>Home</span>
        </a>
        <a href="category.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            <span>Categories</span>
        </a>
        <div class="nav-item center-float-wrapper">
            <a href="cart.html" class="floating-cart ripple">
                <svg viewBox="0 0 24 24" fill="white" stroke="white" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
            </a>
        </div>
        <a href="orders.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
            <span>Orders</span>
        </a>
        <a href="profile.html" class="nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span>Account</span>
        </a>
    </nav>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        const SUPABASE_URL = "https://xjiwwapiqszpnoqaripq.supabase.co";
        const SUPABASE_KEY = "sb_publishable_TJQTU1yv270qrVAEW6Ygwg_HxRtmCTe";
        const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        function toast(msg) {
            const t = document.getElementById("toast");
            t.innerText = msg;
            t.style.display = "block";
            setTimeout(() => {
                t.style.display = "none";
            }, 2500);
        }

        function copyUPI() {
            const upiText = document.getElementById("upi").value;
            navigator.clipboard.writeText(upiText).then(() => {
                toast("UPI ID Copied to Clipboard!");
            }).catch(err => {
                console.error("Could not copy text: ", err);
            });
        }

        function showCustomPopup(title, message, isSuccess = true) {
            document.getElementById("popupTitle").innerText = title;
            document.getElementById("popupMessage").innerText = message;
            
            const icon = document.getElementById("popupIcon");
            if(isSuccess) {
                icon.innerText = "✓";
                icon.classList.remove("warning-mark");
            } else {
                icon.innerText = "!";
                icon.classList.add("warning-mark");
            }
            
            document.getElementById("statusPopup").style.display = "flex";
        }

        function closePopup() {
            document.getElementById("statusPopup").style.display = "none";
            // If it was a success, redirect back to profile
            if(document.getElementById("popupTitle").innerText.includes("Success")) {
                window.location.href = "profile.html";
            }
        }

        async function submitRequest() {
            const USER_ID = localStorage.getItem("userId") || localStorage.getItem("user_id");
            const amount = document.getElementById("amount").value;
            const utr = document.getElementById("utr").value.trim();
            const btn = document.getElementById("submitBtn");

            if(!USER_ID || USER_ID === "guest" || USER_ID === "null") {
                showCustomPopup("Login Required", "Please login to add balance to your wallet.", false);
                return;
            } 
            if(!amount || amount <= 0) {
                showCustomPopup("Invalid Amount", "Please enter a valid amount.", false);
                return;
            }
            if(utr.length < 12) {
                showCustomPopup("Invalid UTR", "Please enter a valid 12-digit UTR or TXN ID.", false);
                return;
            }

            // UI Loading state
            const originalText = btn.innerText;
            btn.innerText = "Submitting...";
            btn.disabled = true;

            try {
                // FIXED LOGIC: Execute database insert first, then check for errors
                const { error } = await client.from("wallet_requests").insert([{
                    user_id: USER_ID,
                    amount: Number(amount),
                    utr: utr
                }]);

                if(error) {
                    throw error;
                }

                // Success
                document.getElementById("amount").value = "";
                document.getElementById("utr").value = "";
                showCustomPopup("Request Submitted!", "Your wallet balance request has been submitted successfully. It will be updated shortly after verification.", true);

            } catch (err) {
                showCustomPopup("Request Failed", err.message || "Something went wrong. Please try again.", false);
            } finally {
                // Reset UI
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
