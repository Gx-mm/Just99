<!-- login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - 99Shops</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    
    <!-- External CSS -->
    <link rel="stylesheet" href="popup.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <!-- Animated Background -->
    <div class="bg-animated">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <!-- Login Container -->
    <div class="login-wrapper">
        <div class="login-card glass-panel scale-anim">
            <div class="login-header">
                <div class="logo-circle glow-anim">99</div>
                <h2>99Shops Admin</h2>
                <p>Sign in to access your dashboard</p>
            </div>
            
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <i class='bx bx-envelope'></i>
                        <input type="email" id="adminEmail" placeholder="admin@99shops.com" required autocomplete="email">
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <i class='bx bx-lock-alt'></i>
                        <input type="password" id="adminPassword" placeholder="Enter your password" required autocomplete="current-password">
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary ripple full-width" id="verifyBtn">
                    Verify Identity <i class='bx bx-right-arrow-alt'></i>
                </button>
            </form>
            
            <div class="login-footer">
                <p><i class='bx bx-shield-quarter'></i> Secured by 3-Step Authentication</p>
            </div>
        </div>
    </div>

    <!-- Secret Code Modal (Step 3) -->
    <div class="modal-overlay" id="secretCodeModal">
        <div class="modal-content glass-panel scale-anim">
            <div class="modal-header">
                <div class="modal-icon"><i class='bx bx-dialpad-alt'></i></div>
                <h2>Enter Secret Code</h2>
                <p>Please enter your administrative secret code to proceed.</p>
            </div>
            <div class="modal-body">
                <form id="secretCodeForm">
                    <div class="form-group">
                        <div class="input-wrapper sc-wrapper">
                            <i class='bx bx-key'></i>
                            <input type="password" id="secretCodeInput" placeholder="Enter 6-digit code" required autocomplete="off" maxlength="10">
                        </div>
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn btn-outline ripple" id="cancelScBtn">Cancel</button>
                        <button type="submit" class="btn btn-primary ripple" id="confirmScBtn">Verify Code</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="popup.js"></script>
    <script src="login.js"></script>
</body>
</html>
